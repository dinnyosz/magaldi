# Magaldi Configuration
# Copy this file to customize your setup
# Environment variables override these values (MAGALDI_*)

# =============================================================================
# DATABASE CONNECTIONS
# =============================================================================

mysql:
  host: localhost
  port: 3306
  database: magaldi
  user: magaldi
  # password: Set via MAGALDI_MYSQL_PASSWORD environment variable
  pool_size: 10
  pool_timeout: 30

search_backend:
  type: opensearch
  host: localhost
  port: 9200
  scheme: http
  index: magaldi_code_elements
  timeout: 30
  retry_on_timeout: true
  max_retries: 3

redis:
  host: localhost
  port: 6379
  db: 0
  # password: Set via MAGALDI_REDIS_PASSWORD if needed

# =============================================================================
# LLM (AI MODELS)
# =============================================================================

llm:
  # Named model configurations
  # All models served via Ollama
  # Use -instruct variants (no-think Modelfiles) for structured output tasks
  models:
    qwen3.5-4b:
      name: qwen3.5:4b
      provider: ollama
      url: http://localhost:11434
    qwen3.5-2b:
      name: qwen3.5:2b
      provider: ollama
      url: http://localhost:11434
    qwen3-4b:
      name: qwen3:4b-instruct
      provider: ollama
      url: http://localhost:11434
    qwen3-1.7b:
      name: qwen3:1.7b-instruct
      provider: ollama
      url: http://localhost:11434

    # --- Embedding ---
    qwen3-embed:
      name: qwen3-embedding:0.6b
      provider: ollama
      url: http://localhost:11434
      dimensions: 1024

    # --- vllm-mlx models (for benchmarking / future use) ---
    qwen3-4b-mlx:
      name: mlx-community/Qwen3-4B-Instruct-2507-4bit
      provider: vllm-mlx
      url: http://localhost:8000
    qwen3-embed-mlx:
      name: mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ
      provider: vllm-mlx
      url: http://localhost:8000
      dimensions: 1024

  # Which models to use for each purpose (reference by name above)
  summarize_model: qwen3-4b             # files, classes, features
  summarize_model_small: qwen3-1.7b     # functions, methods, variables, constants
  embed_model: qwen3-embed
  variable_scoring_model: qwen3-4b      # variable/constant filtering

  # Generation settings
  summarize_temperature: 0.2
  summarize_max_tokens: 512
  summarize_context_window: 8192
  embed_context_window: 32768

# =============================================================================
# WORKER POOLS
# =============================================================================

workers:
  summarization:
    count: 4
    batch_size: 10
    claim_timeout_seconds: 300
    max_retries: 3
    retry_delay_seconds: 5.0

  embedding:
    count: 4
    batch_size: 20
    claim_timeout_seconds: 300
    max_retries: 3
    retry_delay_seconds: 2.0

# =============================================================================
# PARSER SETTINGS
# =============================================================================

parser:
  parallel_workers: 4
  parse_timeout_seconds: 30
  hash_algorithm: sha256
  hash_workers: 4
  hash_chunk_size: 65536
  max_file_size_bytes: 10485760  # 10 MB
  encoding_fallback: latin-1

# =============================================================================
# SEARCH SETTINGS
# =============================================================================

search:
  default_limit: 10
  max_limit: 50
  query_cache_size: 1000
  query_cache_ttl_seconds: 300

# =============================================================================
# WEB UI
# =============================================================================

web:
  host: 0.0.0.0
  port: 8080
  cors_origins:
    - http://localhost:3000
  stats_cache_ttl_seconds: 30
  file_tree_cache_ttl_seconds: 300

# =============================================================================
# MCP SERVER
# =============================================================================

mcp:
  server_name: magaldi
  server_version: "1.0.0"

# =============================================================================
# LOGGING
# =============================================================================

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  # file: /var/log/magaldi/magaldi.log  # Uncomment to log to file

# =============================================================================
# USER DATA MANAGEMENT
# =============================================================================

user_data:
  expiration_days: 30
  cleanup_batch_size: 1000
