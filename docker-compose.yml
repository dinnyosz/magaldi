services:
  # ===========================================================================
  # CORE SERVICES (always started)
  # ===========================================================================

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: magaldi-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.monitoring.collection.enabled=true
      - xpack.monitoring.elasticsearch.collection.enabled=true
      - "ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-1g} -Xmx${ES_HEAP_SIZE:-1g}"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: magaldi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: kibana:8.11.0
    container_name: magaldi-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # OPTIONAL OLLAMA (start with --profile ollama)
  # ===========================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: magaldi-ollama
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support - uncomment for NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama-init:
    image: curlimages/curl:latest
    container_name: magaldi-ollama-init
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling summarization model (qwen2.5-coder:7b)..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name": "qwen2.5-coder:7b"}' || exit 1
        echo ""
        echo "Pulling embedding model (qwen3-embedding:0.6b)..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name": "qwen3-embedding:0.6b"}' || exit 1
        echo ""
        echo "Models ready!"

  # ===========================================================================
  # WEB UI (start with --profile web)
  # ===========================================================================

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: magaldi-web
    restart: unless-stopped
    profiles:
      - web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - MAGALDI_ES_HOST=elasticsearch
      - MAGALDI_ES_PORT=9200
      - MAGALDI_REDIS_HOST=redis
      - MAGALDI_REDIS_PORT=6379
      - MAGALDI_OLLAMA_HOST=ollama
      - MAGALDI_OLLAMA_PORT=11434
      - MAGALDI_WEB_HOST=0.0.0.0
      - MAGALDI_WEB_PORT=8080
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/admin/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  es_data:
    name: magaldi_es_data
  redis_data:
    name: magaldi_redis_data
  ollama_data:
    name: magaldi_ollama_data

networks:
  default:
    name: magaldi-network
