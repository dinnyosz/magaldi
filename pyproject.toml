[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magaldi"
version = "0.1.0"
description = "Code discovery engine for AI agents and developers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Magaldi Project"}
]
keywords = ["code", "search", "semantic", "ai", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # CLI
    "click>=8.1.0",
    # Environment
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    # Config
    "pyyaml>=6.0",
    # HTTP
    "requests>=2.31.0",
    # LLM (unified interface for multiple providers)
    "litellm>=1.0.0",
    # Database
    "elasticsearch>=8.11.0,<9.0.0",
    "redis>=5.0.0",
    # File watching
    "watchdog>=4.0.0",
    # Web
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Parser (tree-sitter with language grammars)
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-markdown>=0.3.0",
    "tree-sitter-yaml>=0.6.0",
    "tree-sitter-toml>=0.6.0",
    "tree-sitter-dockerfile>=0.2.0",
    "tree-sitter-bash>=0.23.0",
    # MCP
    "mcp>=1.0.0",
    # ML/Visualization
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.4",
    "hdbscan>=0.8.33",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    # Linting & Type checking
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
magaldi = "shared.cli:main"
magaldi-mcp = "magaldi_mcp.server:run_server"
magaldi-web = "magaldi_web.app:run_server"

[project.urls]
Homepage = "https://github.com/magaldi/magaldi"
Documentation = "https://github.com/magaldi/magaldi#readme"
Repository = "https://github.com/magaldi/magaldi"
Issues = "https://github.com/magaldi/magaldi/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["magaldi_core*", "magaldi_mcp*", "magaldi_web*", "shared*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

# =============================================================================
# RUFF (linting + formatting)
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict= (Python 3.10+)
]

[tool.ruff.lint.isort]
known-first-party = ["magaldi_core", "magaldi_mcp", "magaldi_web", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MYPY (type checking)
# =============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "tree_sitter_python.*",
    "tree_sitter_javascript.*",
    "tree_sitter_typescript.*",
    "tree_sitter_php.*",
    "tree_sitter_rust.*",
    "tree_sitter_markdown.*",
    "tree_sitter_yaml.*",
    "tree_sitter_toml.*",
    "tree_sitter_dockerfile.*",
    "elasticsearch.*",
    "redis.*",
    "umap.*",
    "sklearn.*",
    "hdbscan.*",
    "litellm.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
]
asyncio_mode = "auto"

# =============================================================================
# COVERAGE
# =============================================================================

[tool.coverage.run]
source = ["src/magaldi_core", "src/magaldi_mcp", "src/magaldi_web", "src/shared"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
